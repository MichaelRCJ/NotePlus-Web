name: noteplus
description: A simple note-taking web application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  intl: ^0.20.2
  google_fonts: ^6.1.0
  table_calendar: ^3.0.9
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  image_picker: ^1.0.4
  shared_preferences_web: ^2.2.2
  signature: ^5.3.2
  flutter_colorpicker: ^1.1.0
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.19.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
