name: noteplus
description: A simple note-taking web application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  uuid: ^4.2.1
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  provider: ^6.1.1
  table_calendar: ^3.1.2
  flutter_colorpicker: ^1.1.0
  file_picker: ^6.1.1
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
